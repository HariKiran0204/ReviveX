services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: recoverai
      POSTGRES_PASSWORD: recoverai
      POSTGRES_DB: recoverai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recoverai -d recoverai"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - recoverai

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - recoverai

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.python
    command: sh -c "alembic upgrade head && uvicorn recoverai_api.main:app --host 0.0.0.0 --port 8000"
    environment:
      APP_ENV: development
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+psycopg://recoverai:recoverai@postgres:5432/recoverai
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:3000
      LLM_PROVIDER: stub
      PAYMENT_PROVIDER: simulator
      SIMULATION_SEED: "42"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - recoverai

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.python
    command: python -m recoverai_worker
    environment:
      APP_ENV: development
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+psycopg://recoverai:recoverai@postgres:5432/recoverai
      REDIS_URL: redis://redis:6379/0
      SIMULATION_SEED: "42"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - recoverai

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - recoverai

volumes:
  postgres_data:

networks:
  recoverai:
    driver: bridge
