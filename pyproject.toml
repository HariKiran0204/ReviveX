[project]
name = "recoverai"
version = "0.1.0"
description = "RecoverAI — Autonomous Revenue Recovery Orchestrator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "redis>=5.2.0",
    "rq>=2.0.0",
    "sqlalchemy>=2.0.36",
    "uvicorn[standard]>=0.32.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",
]

[dependency-groups]
dev = [
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "ruff>=0.8.0",
    "types-redis>=4.6.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["apps/api", "apps/worker", "packages/domain", "packages/db", "packages/providers", "packages/eval"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["apps/api", "apps/worker", "packages/domain", "packages/db", "packages/providers", "packages/eval", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"packages/db/alembic/versions/*.py" = ["E501"]
"packages/db/alembic/env.py" = ["E402"]
"scripts/*.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "apps/api, apps/worker, packages/domain, packages/db, packages/providers, packages/eval"
packages = ["recoverai_api", "recoverai_worker", "recoverai_domain", "recoverai_db", "recoverai_providers", "recoverai_eval"]
exclude = ["apps/web", ".venv"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "pandas.*", "joblib.*"]
ignore_missing_imports = true
