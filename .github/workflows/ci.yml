name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: recoverai
          POSTGRES_PASSWORD: recoverai
          POSTGRES_DB: recoverai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U recoverai -d recoverai"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://recoverai:recoverai@localhost:5432/recoverai
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - run: uv run ruff check apps tests packages
      - run: uv run ruff format --check apps tests packages
      - run: uv run mypy
      - run: uv run alembic upgrade head
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter recoverai-web lint
      - run: pnpm --filter recoverai-web typecheck
      - run: pnpm --filter recoverai-web test
      - run: pnpm --filter recoverai-web build
